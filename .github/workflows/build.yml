name: Windows build and portable checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Ensure installer compiler is available
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler setup failed' }
          }
      - name: Build Windows app and run portable checks
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Check install, upgrade, reinstall and downgrade behavior
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Upload build and validation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KinshipStudio-Windows-x64
          path: |
            artifacts/*.zip
            artifacts/*-Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/publish/engine-test-report.txt
          if-no-files-found: error
          retention-days: 14
